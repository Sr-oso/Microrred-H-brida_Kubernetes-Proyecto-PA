apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: opencem
  labels:
    app: grafana
spec:
  type: NodePort            # nodo:30300 -> localhost:3000 (mapeo de kind)
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: opencem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      initContainers:
        # Renderiza las reglas de alerta con los umbrales del ConfigMap opencem-config.
        - name: render-alertas
          image: grafana/grafana:11.2.0
          command: ["sh", "-c"]
          args:
            - >-
              sed -e "s/__SOC_ALERTA_PCT__/${SOC_ALERTA_PCT}/g"
              -e "s/__MINUTOS_SIN_DATO__/${MINUTOS_SIN_DATO}/g"
              /plantilla/alertas.yaml > /render/alertas.yaml
          env:
            - name: SOC_ALERTA_PCT
              valueFrom:
                configMapKeyRef:
                  name: opencem-config
                  key: SOC_ALERTA_PCT
            - name: MINUTOS_SIN_DATO
              valueFrom:
                configMapKeyRef:
                  name: opencem-config
                  key: MINUTOS_SIN_DATO
          volumeMounts:
            - name: alerting-plantilla
              mountPath: /plantilla
            - name: alerting-render
              mountPath: /render
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencem-credenciales
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: PG_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencem-credenciales
                  key: PG_RO_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting-render
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboard-json
              mountPath: /var/lib/grafana-dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard
        - name: alerting-plantilla
          configMap:
            name: grafana-alerting-plantilla
        - name: alerting-render
          emptyDir: {}