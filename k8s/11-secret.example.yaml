# PLANTILLA con valores de mentira. NO es el Secret real.
# up.sh crea el Secret real con:
#   kubectl create secret generic opencem-credenciales --from-env-file=.env -n opencem
apiVersion: v1
kind: Secret
metadata:
  name: opencem-credenciales
  namespace: opencem
type: Opaque
stringData:
  PG_USER: "usuario_de_ejemplo"
  PG_PASSWORD: "clave_de_ejemplo"
  PG_RO_PASSWORD: "clave_ro_de_ejemplo"
  GF_SECURITY_ADMIN_PASSWORD: "clave_grafana_de_ejemplo"