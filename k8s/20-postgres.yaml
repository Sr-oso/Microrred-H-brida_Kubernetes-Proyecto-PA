# Script de inicialización: crea el usuario de solo lectura. Se ejecuta SOLO la primera vez
# que se crea el volumen. Los permisos sobre gold los aplica el ETL (sql/08_permisos.sql).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: opencem
data:
  01-usuario-lectura.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<EOSQL
    CREATE ROLE opencem_ro LOGIN PASSWORD '${PG_RO_PASSWORD}';
    GRANT CONNECT ON DATABASE ${POSTGRES_DB} TO opencem_ro;
    EOSQL
---
# Servicio interno: los demás pods encuentran la base como "postgres" (DNS del clúster).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opencem
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
# Acceso desde el anfitrión (DBeaver, Power BI): nodo:30543 -> localhost:5433 (mapeo de kind).
apiVersion: v1
kind: Service
metadata:
  name: postgres-externo
  namespace: opencem
  labels:
    app: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
      nodePort: 30543
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: opencem
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: opencem-config
                  key: PG_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opencem-credenciales
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencem-credenciales
                  key: PG_PASSWORD
            - name: PG_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencem-credenciales
                  key: PG_RO_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          # -h 127.0.0.1: durante la inicialización el servidor temporal solo escucha por socket
          # Unix; así la sonda no da "listo" antes de tiempo.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi